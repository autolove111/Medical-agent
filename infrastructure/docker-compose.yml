version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: medlab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medlab_db
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-medlab_user}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-medlab_password}
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medlab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlab_user -d medlab_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  java-backend:
    build:
      context: ../backend-java
      dockerfile: Dockerfile
    container_name: medlab-java-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/medlab_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-medlab_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-medlab_password}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /app/uploads
      SERVER_URL: http://localhost:8080
      OCR_ACCESS_URL: http://java-backend:8080
      LANGCHAIN_SERVICE_URL: http://python-langchain:8000
      OCR_SERVICE_URL: http://python-ocr:8001
      JAVA_LOG_LEVEL: ${JAVA_LOG_LEVEL:-INFO}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      python-langchain:
        condition: service_healthy
      python-ocr:
        condition: service_healthy
    networks:
      - medlab-network
    volumes:
      - ./uploads:/app/uploads
      - medlab_java_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/file/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  python-langchain:
    build:
      context: ../langchain_service
      dockerfile: Dockerfile
    container_name: medlab-langchain
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen3-vl-32b-thinking}
      DATABASE_URL: postgresql://medlab_user:medlab_password@db:5432/medlab_db
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8000
      DOCKER_ENV: "true"
      OCR_SERVICE_URL: http://python-ocr:8001
      GRAPH_SERVICE_URL: http://python-langchain:8000
      BACKEND_URL: http://java-backend:8080
      PYTHON_LOG_LEVEL: ${PYTHON_LOG_LEVEL:-INFO}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RAG_CACHE_TTL_SECONDS: ${RAG_CACHE_TTL_SECONDS:-86400}
      VECTOR_DB_PATH: /app/vector_db
      RAG_USE_LOCAL_EMBEDDING: "true"
      RAG_LOCAL_EMBEDDING_PATH: /app/models/bce-embedding-base_v1
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medlab-network
    volumes:
      - ../langchain_service:/app
      - ./uploads:/app/uploads
      - langchain_vector_db:/app/vector_db
      - langchain_medical_docs:/app/medical_docs
      - medlab_python_logs:/app/logs
      - D:/Users/xiaoli/Desktop/MedLabAgent/bce-embedding-base_v1:/app/models/bce-embedding-base_v1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  python-ocr:
    build:
      context: ../ai-services-python/ocr_service
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-bookworm}
    container_name: medlab-ocr
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl-32b-thinking}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      UPLOAD_DIR: /app/uploads
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-30}
      LLM_API_TIMEOUT: ${LLM_API_TIMEOUT:-60}
      OCR_CACHE_TTL_SECONDS: ${OCR_CACHE_TTL_SECONDS:-3600}
      PYTHON_LOG_LEVEL: ${PYTHON_LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medlab-network
    volumes:
      - ../ai-services-python/ocr_service:/app
      - ./uploads:/app/uploads
      - medlab_ocr_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medlab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medlab-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    external: true
    name: medlab_postgres_data
  redis_data:
  langchain_vector_db:
  langchain_medical_docs:
  medlab_java_logs:
  medlab_python_logs:
  medlab_ocr_logs:
  medlab_nginx_cache:

networks:
  medlab-network:
    driver: bridge