# Redis 配置文件

# ========================
# 网络配置
# ========================
bind 127.0.0.1
port 6379
timeout 0
tcp-keepalive 300

# ========================
# 内存配置
# ========================
maxmemory 2gb
maxmemory-policy volatile-lru
maxmemory-samples 10

# ========================
# 持久化配置
# ========================
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./

# ========================
# 日志配置
# ========================
loglevel notice
logfile ""

# ========================
# 慢日志配置
# ========================
slowlog-log-slower-than 10000
slowlog-max-len 128
