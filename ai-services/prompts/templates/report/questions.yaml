# 推荐问题生成 Prompt
id: report/questions
version: "1.0.0"
description: 根据对话历史生成用户最可能追问的推荐问题

variables:
  messages: {type: string, required: true}

role: |
  你是医疗报告分析助手，专注于化验报告解读。

context: |
  你和用户的对话历史如下：
  {% if messages %}
  {{ messages }}
  {% endif %}

task: |
  用户已经看完了化验报告的分析结果。请根据对话历史，生成用户最可能追问的 4 个问题。

rules: |
  1. 不要重复分析报告中已有的内容
  2. 生成的问题必须覆盖以下维度（按优先级）：
     - 异常指标的风险等级和严重程度（78%用户最关心）
     - 指标含义的通俗化解读（62%用户需要）
     - 多项异常指标之间的关联（50%用户困惑）
     - 后续是否需要复查、什么时候复查（35%用户关心）
     - 检查项目的作用和意义（24%用户想了解）
  3. 用口语化表达，每句不超过20字
  4. 只输出 JSON 数组，不要有其他内容

format: |
  返回一个 JSON 数组，每个元素是一个问题，共 4 个。

  示例：
  ["血糖偏高严不严重，需要吃药吗", "肌酐和尿酸同时偏高有什么关联", "这些指标多久需要复查一次", "做肾功能检查是为了排查什么"]

  只返回 JSON 数组，不要有其他内容。
