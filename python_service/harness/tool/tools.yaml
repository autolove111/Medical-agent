# 工具定义 — 供 prompt 第3层加载
# loader.py 读取此文件，生成工具描述文本注入 prompt

tools:
  - name: reference_lookup
    description: 查询化验指标的参考范围和临床意义
    parameters:
      indicator:
        type: string
        description: 化验指标名称（如"肌酐"、"尿酸"）

  - name: report_interpret
    description: 对一份化验报告进行综合解读
    parameters:
      report_data:
        type: string
        description: 化验报告的结构化数据

  - name: symptom_analyze
    description: 根据症状描述分析可能的疾病方向
    parameters:
      symptoms:
        type: string
        description: 患者的症状描述
