version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: medlab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medlab_db
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-medlab_user}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-medlab_password}
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medlab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlab_user -d medlab_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  java-backend:
    build:
      context: ../backend-java
      dockerfile: Dockerfile
    container_name: medlab-java-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/medlab_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-medlab_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-medlab_password}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /app/uploads
      SERVER_URL: http://localhost:8080
      OCR_ACCESS_URL: http://localhost:8080
      LANGCHAIN_SERVICE_URL: http://host.docker.internal:8000
      OCR_SERVICE_URL: http://host.docker.internal:8001
      JAVA_LOG_LEVEL: ${JAVA_LOG_LEVEL:-INFO}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medlab-network
    volumes:
      - ./uploads:/app/uploads
      - medlab_java_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/file/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: medlab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - medlab-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  medlab_java_logs:

networks:
  medlab-network:
    driver: bridge
